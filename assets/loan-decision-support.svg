<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Outcome decision support overview</title>
  <desc id="desc">A neutral illustration of two outcome categories used in a balanced review.</desc>
  <rect width="1200" height="680" rx="24" fill="#fbfaf7"/>
  <text x="64" y="90" fill="#111827" font-family="Arial,sans-serif" font-size="36" font-weight="700">Outcome review</text>
  <text x="64" y="132" fill="#5b6678" font-family="Arial,sans-serif" font-size="20">Compare outcome volume and rate with the same clear-outcome denominator</text>
  <rect x="64" y="190" width="500" height="250" rx="18" fill="#e6f6f5" stroke="#d9e0e8"/>
  <rect x="636" y="190" width="500" height="250" rx="18" fill="#fff0ef" stroke="#d9e0e8"/>
  <circle cx="314" cy="280" r="36" fill="#0f766e"/><path d="M298 280l12 12 22-27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="886" cy="280" r="36" fill="#ef6262"/><path d="M871 280h30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text x="314" y="365" text-anchor="middle" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="700">Approved</text>
  <text x="886" y="365" text-anchor="middle" fill="#111827" font-family="Arial,sans-serif" font-size="28" font-weight="700">Cancelled</text>
  <text x="64" y="520" fill="#374151" font-family="Arial,sans-serif" font-size="20">Pending, correction, blank, and conflicting outcomes are reported separately.</text>
</svg>
