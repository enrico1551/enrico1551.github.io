<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized operational group view</title>
  <desc id="desc">Illustrative group labels show how operational patterns can be compared without exposing identifying names.</desc>
  <rect width="1200" height="680" rx="24" fill="#fbfaf7"/>
  <text x="64" y="90" fill="#111827" font-family="Arial,sans-serif" font-size="36" font-weight="700">Operational group comparison</text>
  <text x="64" y="132" fill="#5b6678" font-family="Arial,sans-serif" font-size="20">Illustrative labels only · no group-level values are published</text>
  <g font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">
    <rect x="64" y="190" width="330" height="285" rx="18" fill="#fff" stroke="#d9e0e8"/><circle cx="229" cy="295" r="40" fill="#e6f6f5"/><text x="229" y="390" text-anchor="middle">Group A</text>
    <rect x="435" y="190" width="330" height="285" rx="18" fill="#fff" stroke="#d9e0e8"/><circle cx="600" cy="295" r="40" fill="#e6f6f5"/><text x="600" y="390" text-anchor="middle">Group B</text>
    <rect x="806" y="190" width="330" height="285" rx="18" fill="#fff" stroke="#d9e0e8"/><circle cx="971" cy="295" r="40" fill="#e6f6f5"/><text x="971" y="390" text-anchor="middle">Group C</text>
  </g>
  <rect x="64" y="540" width="1072" height="72" rx="14" fill="#e6f6f5"/>
  <text x="90" y="585" fill="#115e59" font-family="Arial,sans-serif" font-size="20">Use anonymized segments for workflow review; do not publish identifying labels.</text>
</svg>
