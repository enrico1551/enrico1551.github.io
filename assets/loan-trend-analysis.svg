<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Monthly trend analysis layout</title>
  <desc id="desc">Illustrative monthly volume and rate chart layout. No data values are shown.</desc>
  <rect width="1200" height="680" rx="24" fill="#fbfaf7"/>
  <text x="64" y="90" fill="#111827" font-family="Arial,sans-serif" font-size="36" font-weight="700">Monthly application trends</text>
  <text x="64" y="132" fill="#5b6678" font-family="Arial,sans-serif" font-size="20">Illustrative layout · data is loaded from an aggregated JSON file</text>
  <rect x="64" y="174" width="1072" height="420" rx="18" fill="#fff" stroke="#d9e0e8"/>
  <path d="M120 510H1080M120 420H1080M120 330H1080M120 240H1080" stroke="#d9e0e8" stroke-width="2"/>
  <text x="120" y="555" fill="#5b6678" font-family="Arial,sans-serif" font-size="18">Monthly periods</text>
  <text x="120" y="214" fill="#5b6678" font-family="Arial,sans-serif" font-size="18">Volume / outcome rate</text>
  <rect x="810" y="620" width="20" height="12" rx="6" fill="#0f766e"/>
  <text x="842" y="633" fill="#374151" font-family="Arial,sans-serif" font-size="17">Applications</text>
  <rect x="980" y="620" width="20" height="12" rx="6" fill="#2ab7ca"/>
  <text x="1012" y="633" fill="#374151" font-family="Arial,sans-serif" font-size="17">Rolling mean</text>
</svg>
